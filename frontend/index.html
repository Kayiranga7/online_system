<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMIZI — Garden &amp; Landscape Studio</title>
    <meta name="description" content="Plants, garden designs, and landscaping services across Rwanda." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Paint the right theme on the very first frame. Mirrors ThemeContext:
      // no explicit choice (imizi:theme with imizi:theme-manual) means follow
      // the browser, and only an opted-in choice is kept in storage.
      (function () {
        try {
          var saved = localStorage.getItem('imizi:theme');
          var manual = localStorage.getItem('imizi:theme-manual');
          var theme = manual && (saved === 'light' || saved === 'dark')
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
